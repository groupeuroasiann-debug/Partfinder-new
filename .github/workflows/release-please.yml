# Optional: opens a release PR when you run it manually.
# Disabled on push because this repo blocks "Actions create pull requests" unless
# Settings → Actions → Allow GitHub Actions to create and approve pull requests is ON.
# Use "Release (direct)" for automated tags + MSIX without a PR.
name: Release Please

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
