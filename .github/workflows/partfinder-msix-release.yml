name: Build MSIX and attach to Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to build (e.g. 1.0.1). Creates tag + draft release if not exists."
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-msix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}".TrimStart('v')
          } else {
            $v = "${{ github.event.release.tag_name }}".TrimStart('v')
          }
          if ($v -notmatch '^\d+\.\d+\.\d+') { throw "Invalid version: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Sync manifest and version.json
        shell: pwsh
        run: ./PartFinder/scripts/set-version.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Create CI code-signing certificate
        id: cert
        shell: pwsh
        run: |
          # Subject must equal Package.appxmanifest Publisher. A different subject
          # (previously CN=DELL) is written into the package and Partner Center rejects it.
          $Publisher = "CN=B96C9A11-7C90-42E9-8C6C-14AD9097B6CD"
          [xml]$manifest = Get-Content ./PartFinder/PartFinder/Package.appxmanifest
          $identity = $manifest.Package.Identity
          if (-not $identity) { $identity = $manifest.DocumentElement.Identity }
          $name = $identity.GetAttribute("Name")
          $pub = $identity.GetAttribute("Publisher")
          if ($name -ne "EuroasiannGroup.partfinder" -or $pub -ne $Publisher) {
            throw "Package.appxmanifest identity is '$name' / '$pub'. Store requires EuroasiannGroup.partfinder / $Publisher."
          }
          $cert = New-SelfSignedCertificate -Type Custom -Subject $Publisher `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}CA=FALSE") `
            -KeyUsage DigitalSignature -FriendlyName "PartFinder MSIX CI" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyExportPolicy Exportable -KeySpec Signature -KeyLength 2048 -HashAlgorithm SHA256
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Publish signed MSIX (x64)
        shell: pwsh
        run: |
          dotnet publish ./PartFinder/PartFinder/PartFinder.csproj `
            -c Release `
            -p:Platform=x64 `
            -p:WindowsPackageType=MSIX `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }} `
            -p:AppxBundle=Never `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:PublishReadyToRun=false `
            -p:PublishTrimmed=false

      - name: Locate MSIX artifact
        id: msix
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path ./PartFinder/PartFinder/AppPackages -Recurse -Filter "*.msix" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msix) { throw "MSIX not found after publish." }
          $name = "PartFinder_${{ steps.ver.outputs.version }}_x64.msix"
          $dest = Join-Path $env:GITHUB_WORKSPACE $name
          Copy-Item $msix.FullName $dest
          "path=$dest" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload MSIX to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: ${{ steps.msix.outputs.path }}

      - name: Manual release (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $ver = "${{ steps.ver.outputs.version }}"
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "PartFinder $ver" --generate-notes --draft
          }
          gh release upload $tag "${{ steps.msix.outputs.path }}" --clobber
          gh release edit $tag --draft=false

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.msix.outputs.name }}
          path: ${{ steps.msix.outputs.path }}
